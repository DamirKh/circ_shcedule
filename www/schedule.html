<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Schedule Configurator</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0f172a;
            color: #e2e8f0;
            min-height: 100vh;
            padding: 10px;
        }
        .container { max-width: 800px; margin: 0 auto; }
        h1 {
            text-align: center;
            margin-bottom: 15px;
            color: #60a5fa;
            font-size: 1.25rem;
        }

        .panel {
            background: #1e293b;
            border-radius: 12px;
            padding: 15px;
            border: 1px solid #334155;
            margin-bottom: 15px;
        }

        .panel h2 {
            font-size: 0.875rem;
            margin-bottom: 12px;
            color: #94a3b8;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        /* 5-minute Grid: 24 rows x 12 columns (5-min intervals) */
        .schedule-grid {
            display: grid;
            grid-template-columns: 45px repeat(12, 1fr);
            gap: 2px;
            background: #0f172a;
            border-radius: 8px;
            padding: 8px;
            overflow-x: auto;
        }

        .grid-header {
            background: #334155;
            padding: 6px 2px;
            text-align: center;
            font-size: 0.65rem;
            color: #cbd5e1;
            border-radius: 4px;
        }

        .grid-hour-label {
            background: #1e293b;
            padding: 8px 4px;
            text-align: right;
            font-weight: bold;
            color: #94a3b8;
            font-size: 0.75rem;
            display: flex;
            align-items: center;
            justify-content: flex-end;
            border-radius: 4px;
            cursor: pointer;  /* Added */
            transition: all 0.2s;  /* Added */
            user-select: none;  /* Added */
        }

        .grid-hour-label:hover {
            background: #3b82f6;  /* Added */
            color: white;  /* Added */
        }

        .grid-cell {
            aspect-ratio: 1;
            cursor: pointer;
            transition: all 0.15s;
            background: #ef4444;
            opacity: 0.3;
            border-radius: 4px;
            position: relative;
        }

        .grid-cell.active {
            background: #10b981;
            opacity: 1;
            box-shadow: 0 0 8px rgba(16, 185, 129, 0.4);
        }

        .grid-cell:hover {
            transform: scale(1.2);
            z-index: 10;
            box-shadow: 0 0 12px rgba(0,0,0,0.5);
        }

        .grid-cell::after {
            content: attr(data-time);
            position: absolute;
            bottom: 100%;
            left: 50%;
            transform: translateX(-50%);
            background: #0f172a;
            color: #e2e8f0;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 0.7rem;
            white-space: nowrap;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s;
            border: 1px solid #334155;
            z-index: 100;
        }

        .grid-cell:hover::after {
            opacity: 1;
        }

        /* Controls */
        .controls {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-bottom: 12px;
        }

        button {
            background: #3b82f6;
            color: white;
            border: none;
            padding: 8px 14px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.8rem;
            transition: all 0.2s;
            font-weight: 500;
        }

        button:hover { background: #2563eb; transform: translateY(-1px); }
        button:active { transform: translateY(0); }
        button.secondary { background: #64748b; }
        button.secondary:hover { background: #475569; }
        button.danger { background: #ef4444; }
        button.danger:hover { background: #dc2626; }
        button.success { background: #10b981; }
        button.success:hover { background: #059669; }

        input[type="text"], input[type="number"] {
            background: #0f172a;
            border: 1px solid #334155;
            color: #e2e8f0;
            padding: 6px 10px;
            border-radius: 6px;
            font-family: monospace;
            font-size: 0.875rem;
        }

        input:focus {
            outline: none;
            border-color: #3b82f6;
        }

        .range-editor {
            display: flex;
            gap: 8px;
            align-items: center;
            flex-wrap: wrap;
            margin-bottom: 10px;
        }

        .range-editor input {
            width: 55px;
            text-align: center;
        }

        .preset-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
            gap: 8px;
        }

        .status-bar {
            background: #1e293b;
            padding: 12px 15px;
            border-radius: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
            border: 1px solid #334155;
        }

        .status-item {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.875rem;
        }

        .status-indicator {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #10b981;
            box-shadow: 0 0 8px rgba(16, 185, 129, 0.5);
        }

        .status-indicator.inactive {
            background: #ef4444;
            box-shadow: 0 0 8px rgba(239, 68, 68, 0.5);
        }

        .hex-display {
            font-family: monospace;
            font-size: 0.7rem;
            word-break: break-all;
            color: #64748b;
            max-height: 80px;
            overflow-y: auto;
            background: #0f172a;
            padding: 10px;
            border-radius: 6px;
            margin-top: 10px;
            border: 1px solid #334155;
            line-height: 1.4;
        }

        .loading {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(15, 23, 42, 0.95);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            gap: 15px;
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid #334155;
            border-top-color: #3b82f6;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        .loading-text {
            color: #94a3b8;
            font-size: 0.875rem;
        }

        .hidden { display: none !important; }

        /* Legend */
        .legend {
            display: flex;
            gap: 20px;
            justify-content: center;
            margin-bottom: 10px;
            font-size: 0.75rem;
            color: #94a3b8;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .legend-box {
            width: 16px;
            height: 16px;
            border-radius: 4px;
        }

        .legend-box.active { background: #10b981; }
        .legend-box.inactive { background: #ef4444; opacity: 0.3; }

        /* Mobile optimizations */
        @media (max-width: 600px) {
            body { padding: 8px; }
            .schedule-grid { gap: 1px; padding: 4px; }
            .grid-header { font-size: 0.6rem; padding: 4px 1px; }
            .grid-hour-label { font-size: 0.65rem; padding: 6px 2px; }
            button { padding: 6px 10px; font-size: 0.75rem; }
        }
    </style>
</head>
<body>
    <div class="loading" id="loading">
        <div class="spinner"></div>
        <div class="loading-text">Loading schedule...</div>
    </div>

    <div class="container">
        <h1>⏰ Schedule Configurator (5-min)</h1>

        <!-- Main Grid Panel -->
        <div class="panel">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
                <h2 style="margin: 0;">Time Grid</h2>
                <div class="legend">
                    <div class="legend-item">
                        <div class="legend-box active"></div>
                        <span>ON</span>
                    </div>
                    <div class="legend-item">
                        <div class="legend-box inactive"></div>
                        <span>OFF</span>
                    </div>
                </div>
            </div>

            <div class="controls">
                <button onclick="setPreset('workday')" class="success">Work (9-18)</button>
                <button onclick="setPreset('night')" class="secondary">Night (22-6)</button>
                <button onclick="setPreset('daylight')" class="secondary">Day (6-22)</button>
                <button onclick="setPreset('always')" class="secondary">All ON</button>
                <button onclick="setPreset('never')" class="danger">All OFF</button>
                <button onclick="invertSchedule()" class="secondary">Invert</button>
            </div>

            <div class="schedule-grid" id="grid"></div>
        </div>

        <!-- Range Editor -->
        <div class="panel">
            <h2>Quick Range</h2>
            <div class="range-editor">
                <input type="number" id="rStartH" placeholder="HH" min="0" max="23" value="9">
                <span>:</span>
                <input type="number" id="rStartM" placeholder="MM" min="0" max="55" step="5" value="0">
                <span>→</span>
                <input type="number" id="rEndH" placeholder="HH" min="0" max="23" value="18">
                <span>:</span>
                <input type="number" id="rEndM" placeholder="MM" min="0" max="55" step="5" value="0">
                <button onclick="applyRange(true)" class="success">ON</button>
                <button onclick="applyRange(false)" class="danger">OFF</button>
            </div>
            <div class="preset-grid">
                <button onclick="quickRange(0,0,12,0)" class="secondary">Morning (0-12)</button>
                <button onclick="quickRange(12,0,24,0)" class="secondary">Afternoon (12-24)</button>
                <button onclick="quickRange(6,0,9,0)" class="secondary">Dawn (6-9)</button>
                <button onclick="quickRange(18,0,22,0)" class="secondary">Evening (18-22)</button>
            </div>
        </div>

        <!-- Import/Export -->
        <div class="panel">
            <h2>Import / Export</h2>
            <input type="text" id="hexInput" placeholder="Paste hex string (360 chars)..."
                   style="width: 100%; margin-bottom: 10px; font-size: 0.75rem;">
            <div class="controls">
                <button onclick="importHex()">Import</button>
                <button onclick="exportHex()" class="secondary">Copy Hex</button>
                <button onclick="exportCompact()" class="secondary">Copy Compact</button>
            </div>
            <div class="hex-display" id="hexDisplay">Click Export to see hex representation...</div>
        </div>

        <!-- Status Bar -->
        <div class="status-bar">
            <div class="status-item">
                <div class="status-indicator" id="statusIndicator"></div>
                <span id="statusText">Ready</span>
            </div>
            <div class="status-item">
                <span>Active: <strong id="activeCount">0</strong> / 288 intervals (<strong id="activeTime">00:00</strong>)</span>
            </div>
            <div class="status-item">
                <button onclick="saveSchedule()" class="success">💾 Save</button>
                <button onclick="loadSchedule()" class="secondary">🔄 Reload</button>
            </div>
        </div>
    </div>

    <script>
        // 5-minute granularity: 24 * 12 = 288 intervals
        const INTERVALS = 288;
        const MINUTES_PER_INTERVAL = 5;
        let scheduleData = new Array(INTERVALS).fill(false);
        let isDragging = false;
        let dragValue = null;

        function init() {
            loadSchedule();
            document.getElementById('loading').classList.add('hidden');
        }

        function createGrid() {
            const grid = document.getElementById('grid');
            grid.innerHTML = '';

            // Header row: 5-min intervals
            grid.appendChild(createCell('Hour', 'grid-header'));
            for (let m = 0; m < 60; m += 5) {
                grid.appendChild(createCell(m.toString().padStart(2, '0'), 'grid-header'));
            }

            // 24 hour rows, 12 cells each (5-min intervals)
            for (let h = 0; h < 24; h++) {
                // Hour label with click handler for inversion
                const hourLabel = createCell(h.toString().padStart(2, '0'), 'grid-hour-label');
                hourLabel.style.cursor = 'pointer';
                hourLabel.title = 'Click to invert hour';
                hourLabel.addEventListener('click', () => invertHour(h));
                grid.appendChild(hourLabel);

                for (let interval = 0; interval < 12; interval++) {
                    const idx = h * 12 + interval;
                    const cell = createCell('', 'grid-cell');
                    const startMin = interval * 5;
                    const endMin = startMin + 5;
                    cell.dataset.index = idx;
                    cell.dataset.time = `${h.toString().padStart(2,'0')}:${startMin.toString().padStart(2,'0')}-${endMin.toString().padStart(2,'0')}`;

                    updateCell(cell, scheduleData[idx]);

                    // Mouse events for drag-paint
                    cell.addEventListener('mousedown', (e) => {
                        e.preventDefault();
                        isDragging = true;
                        dragValue = !scheduleData[idx];
                        toggleInterval(idx, dragValue);
                    });

                    cell.addEventListener('mouseenter', () => {
                        if (isDragging) toggleInterval(idx, dragValue);
                    });

                    cell.addEventListener('touchstart', (e) => {
                        e.preventDefault();
                        toggleInterval(idx, !scheduleData[idx]);
                    }, {passive: false});

                    grid.appendChild(cell);
                }
            }
        }


        function createCell(text, className) {
            const div = document.createElement('div');
            div.className = className;
            div.textContent = text;
            return div;
        }

        function updateCell(cell, active) {
            cell.classList.toggle('active', active);
        }

        function toggleInterval(index, value) {
            scheduleData[index] = value;
            const cell = document.querySelector(`[data-index="${index}"]`);
            if (cell) updateCell(cell, value);
            updateStats();
        }

        // API Functions
        async function loadSchedule() {
            try {
                showStatus('Loading...', true);
                const resp = await fetch('api/schedule');
                const data = await resp.json();
                // Convert from 1440-minute to 288-interval (5-min granularity)
                scheduleData = compressToIntervals(data.minutes);
                createGrid();
                updateStats();
                showStatus('Loaded', true);
                document.getElementById('hexDisplay').textContent = data.hex;
            } catch (e) {
                showStatus('Error: ' + e.message, false);
                createGrid();
            }
        }

        async function saveSchedule() {
            try {
                showStatus('Saving...', true);
                // Expand 288 intervals to 1440 minutes for API
                const minutes = expandToMinutes(scheduleData);

                const resp = await fetch('api/schedule', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({minutes: minutes})
                });
                const result = await resp.json();
                showStatus('Saved!', true);
                document.getElementById('hexDisplay').textContent = result.hex;
            } catch (e) {
                showStatus('Error: ' + e.message, false);
            }
        }

        function compressToIntervals(minutes) {
            // Convert 1440 boolean minutes to 288 5-minute intervals
            const intervals = [];
            for (let i = 0; i < INTERVALS; i++) {
                const start = i * 5;
                // Interval is active if majority (>=3) of 5 minutes are active
                let activeCount = 0;
                for (let m = 0; m < 5; m++) {
                    if (minutes[start + m]) activeCount++;
                }
                intervals.push(activeCount >= 3);
            }
            return intervals;
        }

        function expandToMinutes(intervals) {
            // Convert 288 intervals to 1440 minutes
            const minutes = [];
            for (const active of intervals) {
                for (let m = 0; m < 5; m++) {
                    minutes.push(active);
                }
            }
            return minutes;
        }

        // Range Operations
        function applyRange(value) {
            const sh = parseInt(document.getElementById('rStartH').value) || 0;
            const sm = Math.floor((parseInt(document.getElementById('rStartM').value) || 0) / 5);
            const eh = parseInt(document.getElementById('rEndH').value) || 0;
            const em = Math.floor((parseInt(document.getElementById('rEndM').value) || 0) / 5);

            const startIdx = sh * 12 + sm;
            const endIdx = eh * 12 + em;

            for (let i = startIdx; i < endIdx && i < INTERVALS; i++) {
                scheduleData[i] = value;
            }
            createGrid();
            updateStats();
            showStatus(`Range ${value ? 'ON' : 'OFF'}`, true);
        }

        function quickRange(sh, sm, eh, em) {
            document.getElementById('rStartH').value = sh;
            document.getElementById('rStartM').value = sm;
            document.getElementById('rEndH').value = eh;
            document.getElementById('rEndM').value = em;
        }

        // Presets
        function setPreset(type) {
            switch(type) {
                case 'workday':
                    scheduleData.fill(false);
                    for (let i = 9*12; i < 18*12; i++) scheduleData[i] = true;
                    break;
                case 'night':
                    scheduleData.fill(false);
                    for (let i = 22*12; i < 24*12; i++) scheduleData[i] = true;
                    for (let i = 0; i < 6*12; i++) scheduleData[i] = true;
                    break;
                case 'daylight':
                    scheduleData.fill(false);
                    for (let i = 6*12; i < 22*12; i++) scheduleData[i] = true;
                    break;
                case 'always':
                    scheduleData.fill(true);
                    break;
                case 'never':
                    scheduleData.fill(false);
                    break;
            }
            createGrid();
            updateStats();
            showStatus('Preset applied', true);
        }

        function invertSchedule() {
            scheduleData = scheduleData.map(x => !x);
            createGrid();
            updateStats();
            showStatus('Inverted', true);
        }

        // Invert entire hour (12 intervals)
        function invertHour(hour) {
            const startIdx = hour * 12;
            const endIdx = startIdx + 12;

            // Check current state: if majority is ON, turn all OFF, else turn all ON
            let activeCount = 0;
            for (let i = startIdx; i < endIdx; i++) {
                if (scheduleData[i]) activeCount++;
            }

            // If more than half active -> turn all off, else turn all on
            const newState = activeCount <= 6;

            for (let i = startIdx; i < endIdx; i++) {
                scheduleData[i] = newState;
            }

            // Update only this hour's cells
            for (let i = startIdx; i < endIdx; i++) {
                const cell = document.querySelector(`[data-index="${i}"]`);
                if (cell) updateCell(cell, newState);
            }

            updateStats();
            showStatus(`Hour ${hour.toString().padStart(2,'0')}:00 ${newState ? 'ON' : 'OFF'}`, true);
        }

        // Import/Export
        async function importHex() {
            const hex = document.getElementById('hexInput').value.trim();
            if (!hex || hex.length !== 360) {
                showStatus('Invalid hex (need 360 chars)', false);
                return;
            }
            try {
                const resp = await fetch('api/schedule/hex', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({hex: hex})
                });
                const data = await resp.json();
                scheduleData = compressToIntervals(data.minutes);
                createGrid();
                updateStats();
                showStatus('Imported', true);
            } catch (e) {
                showStatus('Import failed', false);
            }
        }

        function exportHex() {
            const hex = document.getElementById('hexDisplay').textContent.trim();
            if (hex.length === 360) {
                navigator.clipboard.writeText(hex);
                showStatus('Hex copied!', true);
            }
        }

        function exportCompact() {
            // Export as comma-separated ranges, e.g., "09:00-18:00,22:00-06:00"
            const ranges = [];
            let start = null;

            for (let i = 0; i <= INTERVALS; i++) {
                const active = i < INTERVALS ? scheduleData[i] : false;
                if (active && start === null) {
                    start = i;
                } else if (!active && start !== null) {
                    const sh = Math.floor(start / 12);
                    const sm = (start % 12) * 5;
                    const eh = Math.floor(i / 12);
                    const em = (i % 12) * 5;
                    ranges.push(`${sh.toString().padStart(2,'0')}:${sm.toString().padStart(2,'0')}-${eh.toString().padStart(2,'0')}:${em.toString().padStart(2,'0')}`);
                    start = null;
                }
            }

            const compact = ranges.join(',') || 'empty';
            navigator.clipboard.writeText(compact);
            showStatus('Compact format copied!', true);
        }

        // UI Updates
        function updateStats() {
            const active = scheduleData.filter(x => x).length;
            document.getElementById('activeCount').textContent = active;

            // Calculate time: each interval = 5 minutes
            const totalMinutes = active * 5;
            const hours = Math.floor(totalMinutes / 60);
            const minutes = totalMinutes % 60;
            const timeStr = `${hours.toString().padStart(2, '0')}:${minutes.toString().padStart(2, '0')}`;
            document.getElementById('activeTime').textContent = timeStr;
        }

        function showStatus(text, success) {
            const indicator = document.getElementById('statusIndicator');
            const statusText = document.getElementById('statusText');
            indicator.className = 'status-indicator' + (success ? '' : ' inactive');
            statusText.textContent = text;
        }

        // Global mouse up
        document.addEventListener('mouseup', () => {
            isDragging = false;
            dragValue = null;
        });

        // Touch support for mobile
        document.addEventListener('touchend', () => {
            isDragging = false;
        });

        // Start
        init();
    </script>
</body>
</html>
